<!doctype html><html><head><meta charset="utf-8"><title>300px probe</title>
<style>
 body{margin:0;background:#222;font:12px system-ui;color:#eee;display:flex;gap:12px;padding:8px}
 .wrap{border:2px solid #0f0;flex:0 0 auto}
 iframe{width:300px;height:860px;border:0;display:block;background:#fff}
</style></head><body>
<div class="wrap"><iframe id="f" src="/"></iframe></div>
<script>
const f = document.getElementById('f');
window.go = (path) => new Promise(res => { f.onload = () => setTimeout(res, 2500); f.src = path; });
window.probe = function(){
  const d = f.contentDocument, w = f.contentWindow;
  const W = d.documentElement.clientWidth;
  const right = [], tiny = [], clipped = [];
  d.querySelectorAll('*').forEach(el=>{
    const r = el.getBoundingClientRect();
    if (!r.width && !r.height) return;
    const cs = w.getComputedStyle(el);
    if (cs.visibility==='hidden' || cs.opacity==='0' || cs.position==='fixed') return;
    const decorative = el.getAttribute('aria-hidden')==='true' || cs.pointerEvents==='none';
    const label = el.tagName.toLowerCase()+'.'+String(el.className?.baseVal ?? el.className ?? '').split(' ').slice(0,3).join('.');
    const txt = (el.textContent||'').trim().replace(/\s+/g,' ').slice(0,30);
    // element sticks out past the right edge
    if (r.right > W + 1 && !decorative) right.push({el:label, txt, right:Math.round(r.right), over:Math.round(r.right-W)});
    // element scrolls its own content horizontally without being a scroller
    if (el.scrollWidth > el.clientWidth + 1 && cs.overflowX !== 'auto' && cs.overflowX !== 'scroll' && el.clientWidth)
      clipped.push({el:label, txt, client:el.clientWidth, scroll:el.scrollWidth});
    // interactive target too small to tap
    if ((el.tagName==='BUTTON'||el.tagName==='A') && (r.height<24||r.width<24) && txt)
      tiny.push({el:label, txt, w:Math.round(r.width), h:Math.round(r.height)});
  });
  return { viewport:W, docScrollW:d.documentElement.scrollWidth,
           rightOverflow:right.length, clippedText:clipped.length, tinyTargets:tiny.length,
           right:right.slice(0,12), clipped:clipped.slice(0,12), tiny:tiny.slice(0,8) };
};
</script></body></html>
